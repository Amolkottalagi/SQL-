<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History · SQL LLM</title>
<link rel="stylesheet" href="/static/css/style.css">
<script src="/static/js/theme.js"></script>
</head>
<body data-page="history" data-title="History" data-access="user">
<div class="shell">
<aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
<div class="main">
<header class="topbar" id="topbar"></header>
<main class="page" id="page">

<div class="row between mb">
  <div class="row grow">
    <div class="grow"><input type="search" id="search" aria-label="Search your questions" placeholder="Search your questions..." maxlength="100"></div>
    <select id="status" aria-label="Filter by status">
      <option value="">All statuses</option><option value="success">Success</option><option value="error">Error</option>
      <option value="blocked">Blocked</option><option value="clarification">Needed clarification</option>
    </select>
  </div>
  <button class="btn btn-sm btn-ghost" id="clear-all" type="button">Delete all history</button>
</div>
<div id="list"></div>
<div class="row mt"><button class="btn hidden" id="more" type="button">Load more</button></div>
</main>
</div>
</div>
<noscript><p class="page">This app needs JavaScript enabled.</p></noscript>
<script src="/static/js/app.js" defer></script>
<script src="/static/js/history.js" defer></script>
</body>
</html>
