<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usage · SQL LLM</title>
<link rel="stylesheet" href="/static/css/style.css">
<script src="/static/js/theme.js"></script>
</head>
<body data-page="usage" data-title="Usage" data-access="user">
<div class="shell">
<aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
<div class="main">
<header class="topbar" id="topbar"></header>
<main class="page" id="page">

<div class="row between mb">
  <p class="muted grow">Your question and token usage. Daily counts reset at midnight (server time).</p>
  <select id="days" aria-label="Period"><option value="7">Last 7 days</option><option value="14" selected>Last 14 days</option><option value="30">Last 30 days</option></select>
</div>
<div class="grid cols-4" id="stats"></div>
<div class="grid cols-2 mt">
  <div class="card"><h3>Tokens per day</h3><div id="chart-tokens"></div></div>
  <div class="card"><h3>Queries per day</h3><div id="chart-queries"></div></div>
</div>
<div class="card mt"><h3>Daily breakdown</h3><div id="table"></div></div>
</main>
</div>
</div>
<noscript><p class="page">This app needs JavaScript enabled.</p></noscript>
<script src="/static/js/app.js" defer></script>
<script src="/static/js/usage.js" defer></script>
</body>
</html>
